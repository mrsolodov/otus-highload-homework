name: otus-postgresql

x-etcd: &etcd
  image: gcr.io/etcd-development/etcd:v3.5.21
  networks: [cluster]
  environment:
    ETCD_INITIAL_CLUSTER: etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
    ETCD_INITIAL_CLUSTER_STATE: new
    ETCD_INITIAL_CLUSTER_TOKEN: otus-postgresql-12
    ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
    ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
  command: /usr/local/bin/etcd
  healthcheck:
    test: ["CMD", "/usr/local/bin/etcdctl", "endpoint", "health"]
    interval: 5s
    timeout: 5s
    retries: 20

x-postgres: &postgres
  build: ./postgres
  networks: [cluster]
  environment:
    PATRONI_NAME: ${PATRONI_NAME:-pg1}
    PATRONI_POSTGRESQL_CONNECT_ADDRESS: ${PATRONI_NAME:-pg1}:5432
    PATRONI_RESTAPI_CONNECT_ADDRESS: ${PATRONI_NAME:-pg1}:8008
    PATRONI_SUPERUSER_USERNAME: postgres
    PATRONI_SUPERUSER_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/run-lab.sh to generate a local password}
    PATRONI_REPLICATION_USERNAME: replicator
    PATRONI_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?Run scripts/run-lab.sh to generate a local password}
  volumes:
    - ./postgres/patroni.yml:/etc/patroni.yml:ro
  depends_on:
    etcd1: {condition: service_healthy}
    etcd2: {condition: service_healthy}
    etcd3: {condition: service_healthy}
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8008/health"]
    interval: 5s
    timeout: 5s
    retries: 30
    start_period: 20s

services:
  etcd1:
    <<: *etcd
    hostname: etcd1
    environment:
      ETCD_NAME: etcd1
      ETCD_DATA_DIR: /etcd-data
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd1:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd1:2380
      ETCD_INITIAL_CLUSTER: etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: otus-postgresql-12
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
    volumes: [etcd1-data:/etcd-data]
  etcd2:
    <<: *etcd
    hostname: etcd2
    environment:
      ETCD_NAME: etcd2
      ETCD_DATA_DIR: /etcd-data
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd2:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd2:2380
      ETCD_INITIAL_CLUSTER: etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: otus-postgresql-12
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
    volumes: [etcd2-data:/etcd-data]
  etcd3:
    <<: *etcd
    hostname: etcd3
    environment:
      ETCD_NAME: etcd3
      ETCD_DATA_DIR: /etcd-data
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd3:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd3:2380
      ETCD_INITIAL_CLUSTER: etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: otus-postgresql-12
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
    volumes: [etcd3-data:/etcd-data]

  pg1:
    <<: *postgres
    hostname: pg1
    environment:
      PATRONI_NAME: pg1
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg1:5432
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg1:8008
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_SUPERUSER_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/run-lab.sh}
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?Run scripts/run-lab.sh}
    volumes:
      - pg1-data:/var/lib/postgresql/pgdata
      - ./postgres/patroni.yml:/etc/patroni.yml:ro
  pg2:
    <<: *postgres
    hostname: pg2
    environment:
      PATRONI_NAME: pg2
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg2:5432
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg2:8008
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_SUPERUSER_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/run-lab.sh}
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?Run scripts/run-lab.sh}
    volumes:
      - pg2-data:/var/lib/postgresql/pgdata
      - ./postgres/patroni.yml:/etc/patroni.yml:ro
  pg3:
    <<: *postgres
    hostname: pg3
    environment:
      PATRONI_NAME: pg3
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg3:5432
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg3:8008
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_SUPERUSER_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/run-lab.sh}
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?Run scripts/run-lab.sh}
    volumes:
      - pg3-data:/var/lib/postgresql/pgdata
      - ./postgres/patroni.yml:/etc/patroni.yml:ro

  haproxy:
    image: haproxy:3.0-alpine
    networks: [cluster]
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - 127.0.0.1:15432:5432
    depends_on:
      pg1: {condition: service_healthy}
      pg2: {condition: service_healthy}
      pg3: {condition: service_healthy}

networks:
  cluster:
    internal: true

volumes:
  etcd1-data:
  etcd2-data:
  etcd3-data:
  pg1-data:
  pg2-data:
  pg3-data:
