input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["otus-web-logs"]
    group_id => "otus-indexer"
    auto_offset_reset => "earliest"
    codec => json
  }
}

output {
  elasticsearch {
    hosts => ["http://es1:9200", "http://es2:9200", "http://es3:9200"]
    index => "otus-web-%{+YYYY.MM.dd}"
    ilm_enabled => false
    manage_template => false
  }
}
