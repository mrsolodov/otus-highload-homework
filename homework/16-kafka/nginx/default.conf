log_format otus_json escape=json
  '{"event_time":"$time_iso8601","source_host":"$hostname","remote_addr":"$remote_addr",'
  '"method":"$request_method","uri":"$uri","status":$status,'
  '"request_time":$request_time,"request_id":"$request_id"}';

server {
    listen 80;
    server_name _;
    access_log /var/log/otus/access.log otus_json;

    location / {
        default_type text/plain;
        return 200 "Frontend $hostname\n";
    }
}
