apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portal
  namespace: otus-portal
spec:
  ingressClassName: traefik
  rules:
    - host: portal.otus.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portal
                port:
                  name: http
