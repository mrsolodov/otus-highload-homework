apiVersion: v1
kind: ConfigMap
metadata:
  name: portal-content
  namespace: otus-portal
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
      }
      location / {
        auth_basic "OTUS portal";
        auth_basic_user_file /etc/nginx/auth/htpasswd;
        root /usr/share/nginx/html;
        index index.html;
      }
    }
  index.html: |
    <!doctype html>
    <html lang="ru">
    <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>OTUS Portal</title>
    <style>body{font:18px system-ui,sans-serif;max-width:52rem;margin:8vh auto;padding:0 1.5rem;line-height:1.6;color:#1f2937}h1{color:#166534}code{background:#f1f5f9;padding:.2rem .4rem}</style></head>
    <body><h1>Веб-портал OTUS в Kubernetes</h1><p>Портал из учебного стенда Nginx теперь работает в кластере Kubernetes на двух виртуальных машинах.</p><p>Проверка сервиса: <code>/health</code>.</p></body>
    </html>
