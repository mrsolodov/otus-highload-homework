name: 17 Consul DNS

on:
  pull_request:
    paths:
      - 'homework/17-consul/**'
      - '.github/workflows/17-consul.yml'
  push:
    branches: [main]
    paths:
      - 'homework/17-consul/**'
      - '.github/workflows/17-consul.yml'
  workflow_dispatch:

jobs:
  consul-dns:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: homework/17-consul
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax and Compose
        run: |
          bash -n scripts/run-lab.sh
          python3 -m py_compile scripts/verify.py
          python3 -m json.tool consul/web1.json >/dev/null
          python3 -m json.tool consul/web2.json >/dev/null
          docker compose config --quiet
      - name: Check DNS health and cluster failover
        run: timeout 900 bash scripts/run-lab.sh
      - name: Save output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: consul-dns-verification
          path: homework/17-consul/evidence/lab-run.txt
          if-no-files-found: error
      - name: Diagnostic logs
        if: failure()
        run: docker compose ps && docker compose logs --no-color --tail=100 || true
      - name: Remove containers and volumes
        if: always()
        run: docker compose down -v --remove-orphans || true
