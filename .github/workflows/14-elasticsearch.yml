name: 14 Elasticsearch logs

on:
  push:
    paths:
      - 'homework/14-elasticsearch/**'
      - '.github/workflows/14-elasticsearch.yml'
  pull_request:
    paths:
      - 'homework/14-elasticsearch/**'
      - '.github/workflows/14-elasticsearch.yml'
  workflow_dispatch:

jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: otus_es14
    defaults:
      run:
        working-directory: homework/14-elasticsearch
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax and kernel setting
        run: |
          bash -n scripts/run-lab.sh
          python3 -m py_compile scripts/*.py
          docker compose config --quiet
          sudo sysctl -w vm.max_map_count=262144
      - name: Verify ingestion, Kibana and node failure
        run: timeout 1100 bash scripts/run-lab.sh
      - name: Save verification
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: elasticsearch-log-verification
          path: homework/14-elasticsearch/evidence/cluster-check.txt
          if-no-files-found: error
      - name: Logs on failure
        if: failure()
        run: docker compose ps && docker compose logs --no-color --tail=100 || true
      - name: Remove CI containers and volumes
        if: always()
        run: docker compose down -v --remove-orphans || true
