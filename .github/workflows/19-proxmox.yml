name: 19 Proxmox Terraform

on:
  pull_request:
    paths:
      - 'homework/19-proxmox/**'
      - '.github/workflows/19-proxmox.yml'
  push:
    branches: [main]
    paths:
      - 'homework/19-proxmox/**'
      - '.github/workflows/19-proxmox.yml'
  workflow_dispatch:

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: homework/19-proxmox
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.3
      - name: Format
        run: terraform fmt -check -recursive
      - name: Init and validate
        run: |
          terraform init -backend=false
          terraform validate
      - name: Mocked plan of two VMs
        run: terraform test -no-color
